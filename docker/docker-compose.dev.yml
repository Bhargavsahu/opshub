version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: opshub-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: opshub
      POSTGRES_PASSWORD: opshub_dev
      POSTGRES_DB: opshub_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opshub -d opshub_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
